name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy via SSM
        env:
          INSTANCE_ID: i-0f870abe15143cbd5
        run: |
          set -euo pipefail

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters '{"commands":[
              "set -euo pipefail",
              "cd /home/ec2-user/app/chookjibupUser_BE",
              "sudo -u ec2-user git fetch origin",
              "sudo -u ec2-user git reset --hard origin/main",
              "sudo -u ec2-user chmod +x ./gradlew",
              "sudo -u ec2-user env JAVA_HOME=/usr/lib/jvm/java-21-amazon-corretto.x86_64 HOME=/home/ec2-user ./gradlew build -x test --no-daemon",
              "systemctl restart chookjibup-user-backend",
              "sleep 10",
              "systemctl is-active chookjibup-user-backend"
            ]}' \
            --query 'Command.CommandId' --output text)

          echo "SSM Command ID: $COMMAND_ID"

          STATUS="InProgress"
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' --output text)
            echo "Status: $STATUS"
            if [[ "$STATUS" != "InProgress" && "$STATUS" != "Pending" && "$STATUS" != "Delayed" ]]; then
              break
            fi
            sleep 10
          done

          echo "----- Command output -----"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent,StandardErrorContent]' --output text

          if [[ "$STATUS" != "Success" ]]; then
            echo "Deployment failed with status: $STATUS"
            exit 1
          fi
