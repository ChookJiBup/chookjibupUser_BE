# 이 파일을 복사해서 application-secret.yml로 만든 뒤 실제 값을 채우세요.
# cp application-secret.example.yml application-secret.yml
spring:
  mail:
    username: your-gmail-address@gmail.com
    # Google이 표시하는 네 글자 단위 공백을 포함해도 서버에서 제거되지 않으니 붙여서 넣으세요.
    password: xxxxxxxxxxxxxxxx

app:
  jwt:
    secret: change-me-local-jwt-secret-change-before-use
    cookie-name: chookjibup_user_access
    cookie-secure: false
    cookie-same-site: Strict
  mail:
    from: your-gmail-address@gmail.com
  kakao:
    client-id: change-me-kakao-rest-api-key
    client-secret: ""
    redirect-uri: http://localhost:3000/auth/kakao/callback
